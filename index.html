<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarot con Romi — Rituales y Baños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg2:#f7f2ff; --card:#faf7ffcc; --violet:#8a5cf6; --lila:#c9a9f5;
    --violet-deep:#6b3fd4; --text:#3a2a55; --text-dim:#7a6a99; --border:#e2d4fb;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; font-family:'Nunito Sans',system-ui,sans-serif; color:var(--text);
    background:linear-gradient(180deg, var(--bg2), var(--bg) 400px);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  h1,h2,h3{font-family:'Cinzel',serif; letter-spacing:.5px; color:var(--violet-deep); margin:0 0 .4em;}
  .stars{position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #8a5cf655, transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, #c9a9f555, transparent),
      radial-gradient(2px 2px at 40% 80%, #8a5cf644, transparent),
      radial-gradient(1.5px 1.5px at 90% 20%, #c9a9f555, transparent),
      radial-gradient(1.5px 1.5px at 55% 10%, #8a5cf644, transparent),
      radial-gradient(2px 2px at 10% 65%, #c9a9f555, transparent);
    background-repeat:repeat; background-size:600px 600px;
  }
  header{position:relative; z-index:1; text-align:center; padding:48px 20px 24px;}
  .foto-wrap{width:150px; height:150px; margin:0 auto 18px; border-radius:50%;
    padding:4px; background:linear-gradient(135deg, var(--violet), var(--lila));
  }
  .foto-wrap img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:4px solid #fff;}
  header h1{font-size:clamp(28px,6vw,42px);}
  header p{color:var(--text-dim); max-width:520px; margin:10px auto 0; font-size:15px;}
  nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; gap:6px;
    justify-content:center; flex-wrap:wrap; padding:10px; background:#ffffffdd; backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  nav a{color:var(--violet-deep); text-decoration:none; font-size:13px; padding:8px 14px;
    border:1px solid var(--lila); border-radius:20px; white-space:nowrap;}
  nav a:hover{background:#f2ecff;}
  main{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:30px 18px 70px;}
  section{margin-bottom:52px; scroll-margin-top:150px;}
  section > h2{text-align:center; font-size:clamp(22px,4vw,30px); margin-bottom:6px;}
  .divider{text-align:center; color:var(--lila); margin-bottom:26px; font-size:14px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 22px;
    box-shadow:0 4px 18px #8a5cf614;}
  .card h3{font-size:17px; display:flex; align-items:center; gap:8px; color:var(--violet-deep);}
  .card p.desc{color:var(--text-dim); font-size:14px; margin:0 0 12px;}
  .btn{display:inline-block; background:var(--violet); color:#fff; font-weight:700; text-decoration:none;
    padding:14px 30px; border-radius:30px; font-size:15px; margin:6px; box-shadow:0 4px 14px #8a5cf655;}
  .btn.whatsapp{background:#25D366; box-shadow:0 4px 14px #25d36655;}
  footer{position:relative; z-index:1; text-align:center; padding:24px; color:var(--text-dim); font-size:12px;}

  .tirada-botones{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px;}
  .btn-tirada{background:#fff; border:1.5px solid var(--violet); color:var(--violet-deep); font-weight:700;
