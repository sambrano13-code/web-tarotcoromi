<script>
/* ===== Tienda de e-books =====
   Los precios REALES se definen en el backend (Code.gs); estos son solo para mostrar mientras carga.
   Pegá abajo la URL que te da Google Apps Script al implementar (termina en /exec). */
const TIENDA = {
  whatsapp: "5493541290336",
  backend: "PEGAR_URL_DE_APPS_SCRIPT",
  prex: { alias: "Tarotconromi", titular: "Romina Sambrano" },
  ebooks: [
    { id: "arcanos", titulo: "Lectura de Arcanos Mayores", precios: {ARS:15000, USD:10, CLP:9800, UYU:400, MXN:183, COP:32000}, etiqueta: "PDF · 90 páginas",
      puntos: ["Los 22 arcanos del tarot Rider-Waite, uno por uno", "Significado al derecho y al revés", "Amor, trabajo, espiritualidad, prácticas y arquetipos"] },
    { id: "banos", titulo: "Baños Rituales", precios: {ARS:8000, USD:6, CLP:5200, UYU:215, MXN:98, COP:17000}, etiqueta: "PDF · 117 páginas",
      puntos: ["20 baños en 5 categorías", "Ingredientes con cantidades y paso a paso", "Glosario, días de la semana y fases lunares"] },
    { id: "planner", titulo: "Diario de Manifestación & Planner", precios: {ARS:22000, USD:15, CLP:14300, UYU:585, MXN:269, COP:47000}, etiqueta: "PDF imprimible · 297 páginas",
      puntos: ["Agenda perpetua: sirve para cualquier año", "12 meses con rituales de luna nueva y llena", "26 semanas, 31 días, hábitos y gratitud"] }
  ]
};

(function(){
  const sel = new Set();
  let moneda = "ARS", paypalId = "", paypalOk = false, retorno = false;
  const $ = (id) => document.getElementById(id);
  const backendOk = () => TIENDA.backend && TIENDA.backend.indexOf("PEGAR_") === -1;
  const DEMO = !backendOk();            // sin backend: modo demostración (nada se cobra ni se envía)
  if (DEMO) paypalOk = true;
  const MONEDAS = {
    ARS: { n: "Pesos argentinos", f: "🇦🇷", s: "$" }, USD: { n: "Dólares", f: "🌎", s: "US$" },
    CLP: { n: "Pesos chilenos", f: "🇨🇱", s: "CLP $" }, UYU: { n: "Pesos uruguayos", f: "🇺🇾", s: "UYU $" },
    MXN: { n: "Pesos mexicanos", f: "🇲🇽", s: "MXN $" }, COP: { n: "Pesos colombianos", f: "🇨🇴", s: "COP $" }
  };
  const fmt = (n, m) => MONEDAS[m].s + n.toLocaleString("es-AR");
  const byId = (id) => TIENDA.ebooks.find(e => e.id === id);
  const precio = (e) => fmt(e.precios[moneda], moneda);
  const total = () => [...sel].reduce((t, id) => t + byId(id).precios[moneda], 0);
  const totalTxt = () => fmt(total(), moneda);
  const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

  async function api(payload){
    if (DEMO){
      await new Promise(r => setTimeout(r, 500));
      if (payload.action === "createPrex") return { ok: true, pedido: "DEMO-001", monto: total(), moneda: payload.moneda, alias: TIENDA.prex.alias, titular: TIENDA.prex.titular };
      if (payload.action === "createPayPal") return { ok: true, pedido: "DEMO-001", orderID: "DEMO" };
      if (payload.action === "capturePayPal") return { ok: true, pedido: "DEMO-001" };
    }
    const r = await fetch(TIENDA.backend, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Ocurrió un error. Probá de nuevo.");
    return j;
  }

  function renderCards(){
    $("ebooks-lista").innerHTML = TIENDA.ebooks.map(e => `
      <div class="card ebook-card">
        <div class="ebook-cover"><span class="ec-star">✦</span><span class="ec-title">${esc(e.titulo)}</span><span class="ec-by">Tarot con Romi</span></div>
        <div class="ebook-body">
          <h3>${esc(e.titulo)}</h3>
          <div class="ebook-meta">${esc(e.etiqueta)}</div>
          <ul>${e.puntos.map(p => "<li>" + esc(p) + "</li>").join("")}</ul>
          <div style="font-size:12px; color:var(--text-dim); margin:6px 0 2px; line-height:1.6;">${["USD","CLP","UYU","MXN","COP"].map(m => fmt(e.precios[m], m)).join(" · ")}</div>
          <div class="ebook-foot">
            <span class="ebook-precio">${fmt(e.precios.ARS,"ARS")}</span>
            <button type="button" class="btn-add ${sel.has(e.id) ? "on" : ""}" data-id="${e.id}">${sel.has(e.id) ? "✓ Agregado" : "Agregar al pedido"}</button>
          </div>
        </div>
      </div>`).join("");
    document.querySelectorAll(".btn-add").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.id;
      sel.has(id) ? sel.delete(id) : sel.add(id);
      renderCards(); renderPedido();
    }));
  }

  function datos(){
    return { nombre: ($("t-nombre").value || "").trim(), email: ($("t-email").value || "").trim(),
             ok: $("t-acepto").checked, items: [...sel] };
  }
  function validar(){
    const d = datos();
    if (d.nombre.length < 2) return "Escribí tu nombre.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) return "Revisá tu email: ahí te mandamos los e-books.";
    if (!d.ok) return "Aceptá los términos y la política de privacidad para continuar.";
    return "";
  }
  const showErr = (m) => { $("t-error").innerHTML = m ? '<div class="msg-tienda msg-error">' + esc(m) + '</div>' : ""; };

  function renderPedido(){
    const box = $("pedido-contenido");
    if (!sel.size){
      box.innerHTML = '<p class="ped-vacio">Todavía no elegiste ningún e-book. Tocá “Agregar al pedido” en el que quieras.</p>';
      return;
    }
    box.innerHTML = `
      ${[...sel].map(id => `<div class="ped-item"><span>${esc(byId(id).titulo)}</span><span>${precio(byId(id))}</span></div>`).join("")}
      <div class="ped-total"><span>Total</span><span>${totalTxt()}</span></di
